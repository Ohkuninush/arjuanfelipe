# Despliegue de arjuanfelipe.com al VPS (produccion).
#
# Push a main -> este workflow abre SSH al VPS con una clave dedicada cuyo
# authorized_keys tiene `command="/opt/sites/arjuanfelipe/deploy.sh"` forzado:
# la clave NO puede ejecutar nada mas. deploy.sh hace git fetch + reset --hard
# origin/main y publica index.html en el webroot de Nginx de forma atomica.
# No toca Nginx, DNS, TLS ni ninguna otra app del VPS.
#
# Secrets requeridos en el repo (Settings -> Secrets and variables -> Actions):
#   VPS_DEPLOY_KEY  -> clave PRIVADA ed25519 'arjuanfelipe_ci' (contenido completo)
#
# Rollback de la migracion (no de un deploy): revertir los registros DNS de
# Cloudflare al valor de Vercel (A apex 76.76.21.21 / CNAME www cname.vercel-dns.com).

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "notes/**"
      - "es/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-arjuanfelipe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger VPS deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "::error::missing secret VPS_DEPLOY_KEY"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key del VPS fijado (no TOFU).
          echo '158.69.213.49 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIEIW5gOp3Q8L9xRXoIk1KdCIXICxavuHs7do/B+whmP' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # El comando remoto es irrelevante: authorized_keys fuerza deploy.sh.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes \
            ubuntu@158.69.213.49 deploy 2>&1 | tee deploy.log
          grep -q "^deployed arjuanfelipe:" deploy.log
